name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "成果物を作るが Release は作らない"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  # タグと Cargo.toml の版が食い違ったまま配布すると、後から追跡できない。
  # 先に止める。
  check-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        name: 版を確認
        run: |
          set -euo pipefail
          version=$(grep -m1 '^version = ' Cargo.toml | sed -E 's/version = "(.+)"/\1/')
          echo "Cargo.toml の版: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "push" ]; then
            tag="${GITHUB_REF_NAME#v}"
            echo "タグ: $GITHUB_REF_NAME (版として $tag)"
            if [ "$tag" != "$version" ]; then
              echo "タグと Cargo.toml の版が一致しません（$tag != $version）" >&2
              exit 1
            fi
          fi

  build:
    needs: check-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            features: winfsp-backend
            ext: zip
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            features: fuse-backend
            ext: tar.gz
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            features: ""
            ext: tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            features: fuse-backend
            ext: tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: 依存パッケージ（Linux）
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config musl-tools

      - name: ビルド
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${{ matrix.features }}" ]; then
            cargo build --release -p terabox-cli --features "${{ matrix.features }}" --target "${{ matrix.target }}"
          else
            cargo build --release -p terabox-cli --target "${{ matrix.target }}"
          fi

      - name: 名前を整える
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.check-version.outputs.version }}"
          target="${{ matrix.target }}"
          bin="target/$target/release/tbx"
          if [ "${{ runner.os }}" = "Windows" ]; then bin="$bin.exe"; fi
          if [ ! -f "$bin" ]; then echo "成果物がありません: $bin" >&2; exit 1; fi
          out="tbx-$version-$target"
          mkdir -p "dist/$out"
          cp "$bin" "dist/$out/"
          cp README.md CHANGELOG.md "dist/$out/"
          mkdir -p "dist/$out/docs"
          cp docs/*.md "dist/$out/docs/"
          # YAML のブロックスカラー内ではヒアドキュメントの終端を column 0 に
          # 置けないため、行ごとに追記する。
          readme="dist/$out/README.txt"
          : > "$readme"
          echo "tbx (silentbox)" >> "$readme"
          echo "" >> "$readme"
          echo "このアーカイブには tbx のバイナリとドキュメントが入っています。" >> "$readme"
          echo "" >> "$readme"
          echo "Windows:" >> "$readme"
          echo "  WinFsp のバックエンドを使うには WinFsp のランタイムが必要です。" >> "$readme"
          echo "  https://winfsp.dev/ から導入すると、ドライブとしてマウントできます。" >> "$readme"
          echo "  WinFsp が無い場合も WebDAV モードで動きます。" >> "$readme"
          echo "" >> "$readme"
          echo "Linux:" >> "$readme"
          echo "  FUSE のバックエンドを使うには /dev/fuse が必要です。" >> "$readme"
          echo "  資格情報ストア（Secret Service）を使わない場合は tbx login --store file を指定してください。" >> "$readme"
          echo "  musl ビルドは資格情報ストアを含みません。" >> "$readme"

      - name: 起動確認（Linux）
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          bin="target/${{ matrix.target }}/release/tbx"
          if [ "${{ matrix.target }}" = "x86_64-unknown-linux-musl" ]; then
            docker run --rm -v "$PWD/target/${{ matrix.target }}/release:/app" \
              --platform linux/amd64 alpine:3.20 /app/tbx --version
          else
            "$bin" --version
            "$bin" --help > /dev/null
          fi

      - name: 起動確認（Windows）
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bin = "target\${{ matrix.target }}\release\tbx.exe"
          if (-not (Test-Path $bin)) { throw "成果物がありません: $bin" }
          & $bin --version
          if ($LASTEXITCODE -ne 0) { throw "--version が $LASTEXITCODE で終了しました" }

      # Windows だけインストーラを作る。NSIS は windows-latest に同梱されている
      # （実測: NSIS 3.10）。
      - name: インストーラを作る（Windows）
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = "${{ needs.check-version.outputs.version }}"
          $bin = (Resolve-Path "target\${{ matrix.target }}\release\tbx.exe").Path

          # ランナー同梱の NSIS はパスが一定でない（実測: 記載の 3.10 が
          # `C:\Program Files (x86)\NSIS` に見つからず失敗した）。
          # Chocolatey で入れて場所を確実にする。
          $mk = Get-Command makensis -ErrorAction SilentlyContinue
          if (-not $mk) {
            Write-Host "NSIS を導入します"
            choco install nsis --yes --no-progress
            $candidates = @(
              "C:\Program Files (x86)\NSIS\makensis.exe",
              "C:\Program Files\NSIS\makensis.exe"
            )
            foreach ($c in $candidates) {
              if (Test-Path $c) { $mk = @{ Source = $c }; break }
            }
          }
          if (-not $mk) { throw "makensis を導入できませんでした" }
          $env:PATH = "$env:PATH;" + (Split-Path $mk.Source)
          Write-Host "makensis: $($mk.Source)"
          & $mk.Source /VERSION | Select-Object -First 1
          # NSIS は `/D` の値を引用符なしの 1 トークンとして食べるため、
          # 空白を含む絶対パスは渡せない。リポジトリ直下へ `installer-input\tbx.exe`
          # として置き、install から見た相対パスで渡す（名前も tbx.exe に揃える）。
          New-Item -ItemType Directory -Force -Path "installer-input" | Out-Null
          Copy-Item $bin "installer-input\tbx.exe" -Force
          Push-Location install
          & $mk.Source /DVERSION=$version /DEXE=..\installer-input\tbx.exe installer.nsi
          $code = $LASTEXITCODE
          Pop-Location
          if ($code -ne 0) { throw "makensis が $code で終了しました" }
          $setup = "tbx-$version-setup.exe"
          if (-not (Test-Path $setup)) { throw "インストーラができていません: $setup" }
          # 中身の確認: 署名はしないが、サイズが 0 でないことと実行形式であることを見る。
          $size = (Get-Item $setup).Length
          if ($size -lt 1MB) { throw "インストーラが小さすぎます: $size バイト" }
          Write-Host "インストーラ: $setup ($size バイト)"

      # インストーラは静かに展開できないため、実際に起動して
      # 「ファイルが作られたか」までは CI で確認しない（対話 UI を持つ）。
      # 代わりに 7z で中身を一覧して、tbx.exe が含まれることを確認する。
      - name: インストーラの中身を確認
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = "${{ needs.check-version.outputs.version }}"
          $setup = "tbx-$version-setup.exe"
          & 7z l $setup | Select-String -Pattern "tbx.exe" -Quiet
          if (-not $?) { throw "インストーラに tbx.exe が含まれていません" }

      - name: 圧縮
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.check-version.outputs.version }}"
          target="${{ matrix.target }}"
          out="tbx-$version-$target"
          if [ "${{ matrix.ext }}" = "zip" ]; then
            (cd dist && 7z a "../$out.zip" "$out")
          else
            tar -C dist -czf "$out.tar.gz" "$out"
          fi

      - name: Linux 用インストーラ（tar.gz に install.sh を同梱）
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.check-version.outputs.version }}"
          cat > "dist/tbx-$version-${{ matrix.target }}/install.sh" <<'SH'
          #!/bin/sh
          # tbx のユーザー単位インストーラ（管理者権限不要）
          set -eu
          PREFIX="${PREFIX:-$HOME/.local}"
          BIN_DIR="$PREFIX/bin"
          here=$(CDPATH= cd -- "$(dirname -- "$0")" && pwd)
          mkdir -p "$BIN_DIR"
          install -m 755 "$here/tbx" "$BIN_DIR/tbx"
          echo "インストール先: $BIN_DIR/tbx"
          case ":$PATH:" in
            *":$BIN_DIR:"*) echo "PATH には既に入っています。" ;;
            *) echo "次の行を ~/.profile に足してください: export PATH=\"\$PATH:$BIN_DIR\"" ;;
          esac
          echo
          echo "次: $BIN_DIR/tbx login"
          echo "マウント: $BIN_DIR/tbx mount ~/tbx"
          SH
          chmod +x "dist/tbx-$version-${{ matrix.target }}/install.sh"
          # 既存のアーカイブを作り直す（install.sh を含めるため）
          tar -C dist -czf "tbx-$version-${{ matrix.target }}.tar.gz" "tbx-$version-${{ matrix.target }}"

      - uses: actions/upload-artifact@v4
        with:
          name: tbx-${{ needs.check-version.outputs.version }}-${{ matrix.target }}
          path: |
            tbx-${{ needs.check-version.outputs.version }}-${{ matrix.target }}.zip
            tbx-${{ needs.check-version.outputs.version }}-${{ matrix.target }}.tar.gz
            tbx-${{ needs.check-version.outputs.version }}-setup.exe
          if-no-files-found: error

  release:
    needs: [check-version, build]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: 中身を確認（空の Release を出さない）
        run: |
          set -euo pipefail
          count=$(find artifacts -type f \( -name '*.zip' -o -name '*.tar.gz' \) | wc -l)
          setups=$(find artifacts -type f -name '*-setup.exe' | wc -l)
          echo "アーカイブ $count 件 / インストーラ $setups 件"
          find artifacts -type f | sort
          if [ "$count" -lt 4 ]; then
            echo "アーカイブが 4 件に足りません" >&2
            exit 1
          fi
          if [ "$setups" -lt 1 ]; then
            echo "Windows のインストーラがありません" >&2
            exit 1
          fi
      - uses: softprops/action-gh-release@v2
        with:
          # タイトルはバージョン番号のみ（規律）。
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          files: |
            artifacts/**/*.zip
            artifacts/**/*.tar.gz
            artifacts/**/*-setup.exe
          generate_release_notes: false
          body: |
            タグ ${{ github.ref_name }} のビルドです。
            各アーカイブにバイナリとドキュメント（README / CHANGELOG / docs）が入っています。

            Windows の WinFsp バックエンドを使うには WinFsp のランタイムが必要です
            （LGPL/GPL の都合で DLL は同梱していません）。WinFsp が無い環境では
            WebDAV モードで動きます。

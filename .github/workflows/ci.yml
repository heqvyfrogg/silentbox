name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-msvc
      # WinFsp バックエンドは MSVC ターゲットでのみビルドできる（実測）。
      # ビルドが通ることと実行できることは別なので、バイナリを起動して
      # 終了コードを確認する（WinFsp の DLL は同梱しないため、
      # --version だけを実行する）。
      - name: ビルド（WinFsp 込み）
        run: cargo build --release -p terabox-cli --features winfsp-backend,crypt --target x86_64-pc-windows-msvc
      - name: 試験
        run: cargo test --workspace --bins --lib
      - name: バイナリを起動して確認
        run: |
          $exe = "target\x86_64-pc-windows-msvc\release\tbx.exe"
          if (-not (Test-Path $exe)) { throw "ビルド成果物がありません: $exe" }
          & $exe --version
          if ($LASTEXITCODE -ne 0) { throw "--version が $LASTEXITCODE で終了しました" }
          & $exe --help | Out-Null
        shell: pwsh

  # インストーラはリリース時にしか作られないと、壊れたまま配布される。
  # 毎 push でビルドして、文字化けや同梱物の欠落を早く見つける。
  test-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-msvc
      - name: ビルド
        run: cargo build --release -p terabox-cli --features winfsp-backend,crypt --target x86_64-pc-windows-msvc
      - name: NSIS を用意
        shell: pwsh
        run: |
          choco install nsis --yes --no-progress
          $mk = "C:\Program Files (x86)\NSIS\makensis.exe"
          if (-not (Test-Path $mk)) { $mk = "C:\Program Files\NSIS\makensis.exe" }
          if (-not (Test-Path $mk)) { throw "makensis が見つかりません" }
          Write-Host "makensis: $mk"
      - name: 同梱する WinFsp の MSI を検証
        shell: pwsh
        run: |
          # 未改変の公式 MSI だけを同梱する。ライセンス特例の条件なので、
          # ハッシュが一致しないものは配布しない。MSI はリポジトリに置かず、
          # 公式リリースから取得して照合する（2.2 MB を履歴に残さない）。
          $msi = "install\winfsp.msi"
          $url = "https://github.com/winfsp/winfsp/releases/download/v2.1/winfsp-2.1.25156.msi"
          if (-not (Test-Path $msi)) {
            Invoke-WebRequest -Uri $url -OutFile $msi -TimeoutSec 120
          }
          $expected = "073A70E00F77423E34BED98B86E600DEF93393BA5822204FAC57A29324DB9F7A"
          $actual = (Get-FileHash $msi -Algorithm SHA256).Hash
          if ($actual -ne $expected) { throw "WinFsp MSI のハッシュが公式と違います: $actual" }
          Write-Host "OK: $actual"

      - name: インストーラをビルド
        shell: pwsh
        run: |
          $bin = (Resolve-Path "target\x86_64-pc-windows-msvc\release\tbx.exe").Path
          New-Item -ItemType Directory -Force -Path "installer-input" | Out-Null
          Copy-Item $bin "installer-input\tbx.exe" -Force
          Push-Location install
          $mk = "C:\Program Files (x86)\NSIS\makensis.exe"
          if (-not (Test-Path $mk)) { $mk = "C:\Program Files\NSIS\makensis.exe" }
          # VIProductVersion は 4 桁数値のみ。表示名は 0.0.0-ci、版情報は 0.0.0.0。
          & $mk /DVERSION=0.0.0-ci /DVERSION4=0.0.0.0 /DEXE=..\installer-input\tbx.exe installer.nsi
          Pop-Location
          if (-not (Test-Path "tbx-0.0.0-ci-setup.exe")) { throw "インストーラができていません" }
          # 文字化けの再発防止: 生成物に UTF-8 の日本語がそのまま入っているか、
          # 逆に cp1252 由来の文字化け列が無いかを確認する。
          $nsi = Get-Content "install\installer.nsi" -Encoding utf8 -Raw
          if ($nsi -notmatch "設定・キャッシュ・保存済みパスワード") { throw "検証対象の文言が変わっています" }
      - name: 同梱物を確認
        shell: pwsh
        run: |
          & 7z l tbx-0.0.0-ci-setup.exe | Select-String -Pattern "tbx.exe" -Quiet
          if (-not $?) { throw "tbx.exe が入っていません" }
          & 7z l tbx-0.0.0-ci-setup.exe | Select-String -Pattern "winfsp.msi" -Quiet
          if (-not $?) { throw "winfsp.msi が入っていません" }
      - name: 文字化けの再現チェック（BOM 必須）
        shell: bash
        run: |
          set -euo pipefail
          head -c 3 install/installer.nsi | xxd | grep -q "efbb bf" \
            || { echo "installer.nsi に UTF-8 BOM がありません（NSIS が ANSI として読み、日本語が壊れます）" >&2; exit 1; }
          echo "BOM あり: OK"

  test-linux-gnu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: linux-gnu
      # FUSE バックエンドは fuser（純 Rust）なので libfuse は不要。
      # 資格情報ストアは Secret Service を使うため、D-Bus のヘッダが要る。
      - name: 依存パッケージ
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config
      - name: ビルド（FUSE 込み）
        run: cargo build --release -p terabox-cli --features fuse-backend,crypt
      - name: 試験（FUSE 込み）
        # fuse-backend は terabox-cli の feature。ワークスペース全体の試験では
        # terabox-cli を明示して feature を有効にする。
        run: cargo test --workspace --bins --lib --features terabox-cli/fuse-backend
      - name: バイナリを起動して確認
        run: |
          ./target/release/tbx --version
          ./target/release/tbx --help > /dev/null

  test-linux-musl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
        with:
          key: linux-musl
      # musl は D-Bus の静的リンクが現実的でないため、資格情報ストアを積まない。
      # `--store file` を明示して使う（README に記載）。
      #
      # `ring` は C コードを含むため musl 用のクロス gcc が要る。実測:
      # 無いと `failed to find tool "x86_64-linux-musl-gcc"` で止まる。
      - name: musl のクロスコンパイラ
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
      - name: ビルド
        run: cargo build --release -p terabox-cli --target x86_64-unknown-linux-musl
      - name: alpine で起動確認（ビルドが通るだけでは足りない）
        run: |
          docker run --rm -v "$PWD/target/x86_64-unknown-linux-musl/release:/app" \
            --platform linux/amd64 alpine:3.20 /app/tbx --version

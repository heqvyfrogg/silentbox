name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-msvc
      # WinFsp バックエンドは MSVC ターゲットでのみビルドできる（実測）。
      # ビルドが通ることと実行できることは別なので、バイナリを起動して
      # 終了コードを確認する（WinFsp の DLL は同梱しないため、
      # --version だけを実行する）。
      - name: ビルド（WinFsp 込み）
        run: cargo build --release -p terabox-cli --features winfsp-backend,crypt --target x86_64-pc-windows-msvc
      - name: 試験
        run: cargo test --workspace --bins --lib
      - name: バイナリを起動して確認
        run: |
          $exe = "target\x86_64-pc-windows-msvc\release\tbx.exe"
          if (-not (Test-Path $exe)) { throw "ビルド成果物がありません: $exe" }
          & $exe --version
          if ($LASTEXITCODE -ne 0) { throw "--version が $LASTEXITCODE で終了しました" }
          & $exe --help | Out-Null
        shell: pwsh

  # インストーラはリリース時にしか作られないと、壊れたまま配布される。
  # 毎 push でビルドして、文字化けや同梱物の欠落を早く見つける。
  test-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-msvc
      - name: ビルド
        run: cargo build --release -p terabox-cli --features winfsp-backend,crypt --target x86_64-pc-windows-msvc
      - name: NSIS を用意
        shell: pwsh
        run: |
          choco install nsis --yes --no-progress
          $mk = "C:\Program Files (x86)\NSIS\makensis.exe"
          if (-not (Test-Path $mk)) { $mk = "C:\Program Files\NSIS\makensis.exe" }
          if (-not (Test-Path $mk)) { throw "makensis が見つかりません" }
          Write-Host "makensis: $mk"
      - name: 同梱する WinFsp の MSI を検証
        shell: pwsh
        run: |
          # 未改変の公式 MSI だけを同梱する。ライセンス特例の条件なので、
          # ハッシュが一致しないものは配布しない。MSI はリポジトリに置かず、
          # 公式リリースから取得して照合する（2.2 MB を履歴に残さない）。
          $msi = "install\winfsp.msi"
          $url = "https://github.com/winfsp/winfsp/releases/download/v2.1/winfsp-2.1.25156.msi"
          if (-not (Test-Path $msi)) {
            # 外部からの取得は 1 回で失敗し得る（実測: GitHub が 504 を返した）。
          # 3 回まで間を空けて再試行し、それでも駄目なら失敗させる。
          $ok = $false
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            try {
              Invoke-WebRequest -Uri $url -OutFile $msi -TimeoutSec 120
              $ok = $true
              break
            } catch {
              Write-Host "取得に失敗（$attempt 回目）: $_"
              if ($attempt -lt 3) { Start-Sleep -Seconds (5 * $attempt) }
            }
          }
          if (-not $ok) { throw "WinFsp の MSI を取得できません: $url" }
          }
          $expected = "073A70E00F77423E34BED98B86E600DEF93393BA5822204FAC57A29324DB9F7A"
          $actual = (Get-FileHash $msi -Algorithm SHA256).Hash
          if ($actual -ne $expected) { throw "WinFsp MSI のハッシュが公式と違います: $actual" }
          Write-Host "OK: $actual"

      - name: インストーラをビルド
        shell: pwsh
        run: |
          $bin = (Resolve-Path "target\x86_64-pc-windows-msvc\release\tbx.exe").Path
          New-Item -ItemType Directory -Force -Path "installer-input" | Out-Null
          Copy-Item $bin "installer-input\tbx.exe" -Force
          Push-Location install
          $mk = "C:\Program Files (x86)\NSIS\makensis.exe"
          if (-not (Test-Path $mk)) { $mk = "C:\Program Files\NSIS\makensis.exe" }
          # VIProductVersion は 4 桁数値のみ。表示名は 0.0.0-ci、版情報は 0.0.0.0。
          & $mk /DVERSION=0.0.0-ci /DVERSION4=0.0.0.0 /DEXE=..\installer-input\tbx.exe installer.nsi
          Pop-Location
          if (-not (Test-Path "tbx-0.0.0-ci-setup.exe")) { throw "インストーラができていません" }
          # 文字化けの再発防止: 生成物に UTF-8 の日本語がそのまま入っているか、
          # 逆に cp1252 由来の文字化け列が無いかを確認する。
          $nsi = Get-Content "install\installer.nsi" -Encoding utf8 -Raw
          if ($nsi -notmatch "設定・キャッシュ・保存済みパスワード") { throw "検証対象の文言が変わっています" }
      - name: 同梱物を確認
        shell: pwsh
        run: |
          & 7z l tbx-0.0.0-ci-setup.exe | Select-String -Pattern "tbx.exe" -Quiet
          if (-not $?) { throw "tbx.exe が入っていません" }
          & 7z l tbx-0.0.0-ci-setup.exe | Select-String -Pattern "winfsp.msi" -Quiet
          if (-not $?) { throw "winfsp.msi が入っていません" }
      - name: 文字化けの再現チェック（BOM 必須）
        shell: bash
        run: |
          set -euo pipefail
          head -c 3 install/installer.nsi | xxd | grep -q "efbb bf" \
            || { echo "installer.nsi に UTF-8 BOM がありません（NSIS が ANSI として読み、日本語が壊れます）" >&2; exit 1; }
          # 補助の PowerShell も BOM が無いと Windows PowerShell 5.1 が ANSI として
          # 読み、日本語コメントで構文が壊れる（実測）。
          head -c 3 install/update-path.ps1 | xxd | grep -q "efbb bf" \
            || { echo "update-path.ps1 に UTF-8 BOM がありません" >&2; exit 1; }
          echo "BOM あり: OK"

      # Issue #1 の回帰テスト。PATH が長い環境で、インストーラが既存エントリを
      # 失わないこと、二重追記しないこと、アンインストーラが元へ戻すことを
      # 実プロセスで確かめる。setx（1024 文字で切る）と NSIS の ReadRegStr
      # （1024 文字以上は空になる）の両方を踏んでいるので、実測で固定する。
      - name: PATH を壊さないことの実測（Issue #1）
        shell: pwsh
        run: |
          $dir = "$env:LOCALAPPDATA\silentbox"
          $key = [Microsoft.Win32.Registry]::CurrentUser

          # 1024 文字を超える PATH を作る（壊れる条件を満たす）。
          $long = ((1..80) | ForEach-Object { "C:\ci-path-segment-$_\a-fairly-long-directory-name" }) -join ';'
          if ($long.Length -le 1024) { throw "テスト用 PATH が短すぎます: $($long.Length)" }

          $k = $key.OpenSubKey("Environment", $true)
          $saved = $null
          try {
            $saved = $k.GetValue("Path", "", [Microsoft.Win32.RegistryValueOptions]::DoNotExpandEnvironmentNames)
            $k.SetValue("Path", $long, [Microsoft.Win32.RegistryValueKind]::String)
          } finally { $k.Close() }

          try {
            $before = $long.Length
            Write-Host "テスト用 PATH: $before 文字"

            # 1) インストール。既存エントリが 1 つも失われないこと。
            $proc = Start-Process -FilePath "tbx-0.0.0-ci-setup.exe" -ArgumentList "/S" -PassThru
            $proc.WaitForExit(180000) | Out-Null
            $k2 = $key.OpenSubKey("Environment", $false)
            $after = [string]$k2.GetValue("Path", "", [Microsoft.Win32.RegistryValueOptions]::DoNotExpandEnvironmentNames)
            $k2.Close()

            if ($after.Length -le $before) { throw "PATH が伸びていません（$before -> $($after.Length)）" }
            if ($after -notmatch [regex]::Escape($dir)) { throw "PATH に $dir が入っていません" }
            $lost = (1..80) | Where-Object { $after -notmatch [regex]::Escape("ci-path-segment-$_") }
            if ($lost) { throw "PATH から既存エントリが失われました: segment $($lost -join ',')" }
            Write-Host "インストール後: $($after.Length) 文字（既存エントリは全て残存）"

            # 2) 二重インストールで重複追記しないこと。
            $proc = Start-Process -FilePath "tbx-0.0.0-ci-setup.exe" -ArgumentList "/S" -PassThru
            $proc.WaitForExit(180000) | Out-Null
            $k3 = $key.OpenSubKey("Environment", $false)
            $again = [string]$k3.GetValue("Path", "", [Microsoft.Win32.RegistryValueOptions]::DoNotExpandEnvironmentNames)
            $k3.Close()
            if ($again.Length -ne $after.Length) {
              throw "再インストールで PATH が変わりました（$($after.Length) -> $($again.Length)）"
            }

            # 3) アンインストールで元へ戻ること。
            #
            # NSIS のアンインストーラは自分自身を一時ディレクトリへ複製して
            # 起動し、元のプロセスはすぐ終了する。WaitForExit は「複製が始まった
            # 時点」で返るため、PATH の後始末が終わったことを保証しない
            # （CI で 4115 文字のまま判定に失敗した）。
            # そのため、PATH が元の値へ戻るまでポーリングして待つ。
            $u = Join-Path $dir "uninstall.exe"
            if (-not (Test-Path $u)) { throw "アンインストーラがありません: $u" }
            $proc = Start-Process -FilePath $u -ArgumentList "/S" -PassThru
            $proc.WaitForExit(180000) | Out-Null

            $restored = ""
            $deadline = (Get-Date).AddSeconds(120)
            while ((Get-Date) -lt $deadline) {
              $k4 = $key.OpenSubKey("Environment", $false)
              $restored = [string]$k4.GetValue("Path", "", [Microsoft.Win32.RegistryValueOptions]::DoNotExpandEnvironmentNames)
              $k4.Close()
              if ($restored -eq $long) { break }
              Start-Sleep -Milliseconds 500
            }
            if ($restored -ne $long) {
              throw "アンインストール後の PATH が元と違います（$($restored.Length) 文字、期待 $($long.Length) 文字）"
            }
            Write-Host "アンインストール後: $($restored.Length) 文字（元と一致）"
          } finally {
            # 必ず元の PATH へ戻す（CI ランナーの後続処理を壊さない）。
            $k5 = $key.OpenSubKey("Environment", $true)
            try {
              $k5.SetValue("Path", [string]$saved, [Microsoft.Win32.RegistryValueKind]::String)
            } finally { $k5.Close() }
            Remove-Item $dir -Recurse -Force -ErrorAction SilentlyContinue
          }

  test-linux-gnu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: linux-gnu
      # FUSE バックエンドは fuser（純 Rust）なので libfuse は不要。
      # 資格情報ストアは Secret Service を使うため、D-Bus のヘッダが要る。
      - name: 依存パッケージ
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config
      - name: ビルド（FUSE 込み）
        run: cargo build --release -p terabox-cli --features fuse-backend,crypt
      - name: 試験（FUSE 込み）
        # fuse-backend は terabox-cli の feature。ワークスペース全体の試験では
        # terabox-cli を明示して feature を有効にする。
        run: cargo test --workspace --bins --lib --features terabox-cli/fuse-backend
      - name: バイナリを起動して確認
        run: |
          ./target/release/tbx --version
          ./target/release/tbx --help > /dev/null

  test-linux-musl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
        with:
          key: linux-musl
      # musl は D-Bus の静的リンクが現実的でないため、資格情報ストアを積まない。
      # `--store file` を明示して使う（README に記載）。
      #
      # `ring` は C コードを含むため musl 用のクロス gcc が要る。実測:
      # 無いと `failed to find tool "x86_64-linux-musl-gcc"` で止まる。
      - name: musl のクロスコンパイラ
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
      - name: ビルド
        run: cargo build --release -p terabox-cli --target x86_64-unknown-linux-musl
      - name: alpine で起動確認（ビルドが通るだけでは足りない）
        run: |
          docker run --rm -v "$PWD/target/x86_64-unknown-linux-musl/release:/app" \
            --platform linux/amd64 alpine:3.20 /app/tbx --version

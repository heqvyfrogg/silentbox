[package]
name = "terabox-mount"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "tbx: Windows mount backends (WinFsp / WebDAV) for TeraBox"
build = "build.rs"

[dependencies]
terabox-core.workspace = true
async-trait = "0.1"
tempfile = "3"
tokio.workspace = true
anyhow.workspace = true
futures.workspace = true
bytes.workspace = true
serde_json.workspace = true
chrono.workspace = true
tracing.workspace = true
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
urlencoding.workspace = true

[target.'cfg(windows)'.dependencies]
# WinFsp の DLL を絶対パスで先に読み込む（遅延ロードの解決順を確定させる）。
libloading = "0.8"
# `system` feature は使わない。有効にすると winfsp-sys がビルド時に
# `winfsp/inc/winfsp.h` を要求し、ランタイムだけを入れた環境では
# ビルドできない（実測: MSI は inc を含まない）。DLL の場所は自前で
# 解決し、絶対パスで先に読み込む（`preload_winfsp_dll`）。
winfsp = { version = "0.13", optional = true }

[target.'cfg(unix)'.dependencies]
fuser = { version = "0.18", optional = true }

[features]
default = []
# WinFsp バックエンド。MSVC ターゲットでのみ実用的にビルドできる（実測）。
winfsp-backend = ["dep:winfsp"]
# Linux / macOS の FUSE バックエンド。libfuse は使わず純 Rust の fuser で実装する。
fuse-backend = ["dep:fuser"]
# rclone crypt 互換の暗号化層。既定では含めない。
crypt = ["terabox-core/crypt"]

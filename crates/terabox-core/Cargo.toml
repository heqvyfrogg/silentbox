[package]
name = "terabox-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "TeraBox protocol client: session, API, transfer engine, VFS model"

[dependencies]
async-trait = "0.1"
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
reqwest.workspace = true
tokio.workspace = true
futures.workspace = true
bytes.workspace = true
sha2.workspace = true
md-5.workspace = true
crc32fast.workspace = true
base64.workspace = true
hex.workspace = true
urlencoding.workspace = true
chrono.workspace = true
toml.workspace = true
dirs.workspace = true
rusqlite.workspace = true
rand.workspace = true
tracing.workspace = true

# 暗号化 VFS（rclone crypt 互換）。既定では含めない。
aes = { workspace = true, optional = true }
xsalsa20poly1305 = { workspace = true, optional = true }
scrypt = { workspace = true, optional = true }
data-encoding = { workspace = true, optional = true }
zeroize = { workspace = true, optional = true }

[features]
default = []
# rclone crypt 互換の暗号化層。`--crypt` を使うときに有効化する。
crypt = [
    "dep:aes",
    "dep:xsalsa20poly1305",
    "dep:scrypt",
    "dep:data-encoding",
    "dep:zeroize",
]

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "io-util"] }
tempfile = "3"
rcgen = { version = "0.13", default-features = false, features = ["crypto", "ring", "pem"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-pki-types = "1"

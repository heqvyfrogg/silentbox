[package]
name = "terabox-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "tbx: unofficial TeraBox command-line client"

build = "build.rs"

[[bin]]
name = "tbx"
path = "src/main.rs"

[dependencies]
terabox-core.workspace = true
terabox-tui.workspace = true
terabox-mount.workspace = true

anyhow.workspace = true
thiserror.workspace = true
reqwest.workspace = true
clap = { version = "4", features = ["derive", "env"] }
tokio.workspace = true
serde_json.workspace = true
serde.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
dirs.workspace = true
open = "5"
rpassword = "7"
chrono.workspace = true
urlencoding.workspace = true
tokio-tungstenite = "0.24"
futures-util = "0.3"
regex = "1"

# 資格情報ストアは OS ごとにバックエンドが違う。musl では D-Bus の
# 静的リンクが現実的でないため積まない（`--store file` を使う）。
[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
# 自動実行の登録（HKCU の Run キー）。
winreg = "0.52"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(all(unix, not(target_os = "macos"), target_env = "gnu"))'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }

[dev-dependencies]
# 互換検証の診断用（examples から使う）。
xsalsa20poly1305 = "0.9"
scrypt = "0.11"

[features]
default = []
# WinFsp バックエンドを tbx に含める。MSVC ターゲットでのみ実用的（実測）。
winfsp-backend = ["terabox-mount/winfsp-backend"]
# Linux の FUSE バックエンドを含める。
fuse-backend = ["terabox-mount/fuse-backend"]
# rclone crypt 互換の暗号化マウント。既定では含めない。
crypt = ["terabox-core/crypt", "terabox-mount/crypt"]
